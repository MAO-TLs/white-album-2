name: Enforce MAO Identity

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  identity:
    name: MAO identity
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact proposed commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Reject every non-MAO actor or commit identity
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          readonly expected_actor='MAO-TLs'
          readonly expected_name='MAO Translations'
          readonly expected_email='MAO-TLs@users.noreply.github.com'
          readonly zero='0000000000000000000000000000000000000000'

          if [[ "$ACTOR" != "$expected_actor" ]]; then
            echo 'Rejected: only MAO-TLs may propose repository changes.' >&2
            exit 1
          fi

          if [[ "$EVENT_NAME" == 'pull_request' ]]; then
            range="$BASE_SHA..$HEAD_SHA"
          elif [[ -z "${BEFORE_SHA:-}" || "$BEFORE_SHA" == "$zero" ]]; then
            range="$AFTER_SHA"
          else
            range="$BEFORE_SHA..$AFTER_SHA"
          fi

          mapfile -t commits < <(git rev-list "$range")
          if (( ${#commits[@]} == 0 )); then
            echo 'Rejected: no commits were available for identity verification.' >&2
            exit 1
          fi

          for commit in "${commits[@]}"; do
            author_name=$(git show -s --format='%an' "$commit")
            author_email=$(git show -s --format='%ae' "$commit")
            committer_name=$(git show -s --format='%cn' "$commit")
            committer_email=$(git show -s --format='%ce' "$commit")

            if [[ "$author_name" != "$expected_name" ||
                  "$author_email" != "$expected_email" ||
                  "$committer_name" != "$expected_name" ||
                  "$committer_email" != "$expected_email" ]]; then
              echo "Rejected commit $commit: author and committer must use the MAO-TLs identity." >&2
              exit 1
            fi
          done

          echo "Verified ${#commits[@]} MAO-authored commit(s)."
